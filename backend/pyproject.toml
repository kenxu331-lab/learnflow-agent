[project]
name = "learnflow-backend"
version = "0.1.0"
description = "Local-first backend foundation for LearnFlow Agent."
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.8,<3.0",
    "uvicorn>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9,<1.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
